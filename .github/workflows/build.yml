name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "gd-modmenu"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: mod
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

      - name: Collect build errors
        if: steps.mod.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "GEODE_SDK=$GEODE_SDK"
            ls "$GEODE_SDK" 2>&1 | head -20
            echo "--- configure"
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" -G Ninja -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Win64 2>&1 | tail -n 40
            echo "--- build"
            cmake --build build --parallel 2>&1 | grep -v '^\[' | tail -n 80
          } > diag.txt 2>&1 || true
          msg=$(sed 's/%/%25/g' diag.txt | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build diagnostics::${msg:0:60000}"

      - name: Fail if build failed
        if: steps.mod.outcome == 'failure'
        shell: bash
        run: exit 1

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
